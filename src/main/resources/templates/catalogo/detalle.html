<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav th:replace="~{fragments/menu :: menu}"></nav>
    <main>
        <div th:replace="~{fragments/menu :: mensajes}"></div>

        <h1 th:text="${producto.nombre}"></h1>
        <p th:text="${producto.descripcion}"></p>
        <p class="precio" th:text="'$' + ${#numbers.formatDecimal(producto.calcularPrecio(), 1, 2)}"></p>
        <p th:if="${promedio != null}">
            Puntuación promedio: <strong th:text="${#numbers.formatDecimal(promedio, 1, 1)} + ' / 5'"></strong>
        </p>
        <p th:if="${promedio == null}">Todavía no hay reseñas.</p>

        <h2>Reseñas</h2>
        <div class="tarjeta" th:each="r : ${resenas}">
            <strong th:text="${r.usuario.nombre}"></strong>
            <span th:text="${r.puntuacion} + ' / 5'"></span>
            <small th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}"></small>
            <p th:text="${r.comentario}"></p>
        </div>

        <h2>Dejá tu reseña</h2>
        <p th:unless="${usuarioActual}">
            <a th:href="@{/login}">Iniciá sesión</a> para escribir una reseña.
        </p>

        <form th:if="${usuarioActual}" th:action="@{/producto/{id}/resena(id=${producto.id})}"
              th:object="${resenaForm}" method="post">
            <label>Puntuación (1 a 5)</label>
            <select th:field="*{puntuacion}">
                <option th:each="n : ${#numbers.sequence(5, 1, -1)}" th:value="${n}" th:text="${n}"></option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('puntuacion')}" th:errors="*{puntuacion}"></small>

            <label>Comentario</label>
            <input type="text" th:field="*{comentario}">
            <small class="error" th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}"></small>

            <button class="boton" type="submit">Publicar reseña</button>
        </form>

        <a class="boton secundario" th:href="@{/catalogo}">Volver al catálogo</a>
    </main>
</body>
</html>
