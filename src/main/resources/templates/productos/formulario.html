<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
    <nav th:replace="~{fragments/menu :: menu}"></nav>

    <main>
        <div th:replace="~{fragments/menu :: mensajes}"></div>

        <h1 th:text="${form.id == null} ? 'Nuevo producto' : 'Editar producto'"></h1>

        <form th:action="@{/productos/guardar}" th:object="${form}" method="post">
            <input type="hidden" th:field="*{id}">

            <label>Tipo de producto</label>
            <select th:field="*{tipo}" onchange="mostrarCampos()" th:disabled="*{id != null}">
                <option value="BEBIDA">Bebida</option>
                <option value="COMIDA">Comida</option>
                <option value="POSTRE">Postre</option>
            </select>
            <!-- un select deshabilitado no se envía, por eso este campo oculto al editar -->
            <input type="hidden" name="tipo" th:if="*{id != null}" th:value="*{tipo}">

            <label>Nombre</label>
            <input type="text" th:field="*{nombre}">
            <small class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>

            <label>Descripción</label>
            <input type="text" th:field="*{descripcion}">

            <label>Precio base</label>
            <input type="number" step="0.01" th:field="*{precioBase}">
            <small class="error" th:if="${#fields.hasErrors('precioBase')}" th:errors="*{precioBase}"></small>

            <label>Categoría</label>
            <select th:field="*{categoriaId}">
                <option value="">-- Elegí una categoría --</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
            </select>
            <small class="error" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></small>

            <label><input type="checkbox" th:field="*{disponible}"> Disponible</label>

            <div id="campos-BEBIDA">
                <label>Tamaño (ml)</label>
                <input type="number" min="0" th:field="*{tamanoMl}">
                <small class="error" th:if="${#fields.hasErrors('tamanoMl')}" th:errors="*{tamanoMl}"></small>
                <label><input type="checkbox" th:field="*{esFria}"> Es fría</label>
            </div>

            <div id="campos-COMIDA">
